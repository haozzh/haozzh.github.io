short_bio: >-
  <p>
    I am an Associate Professor (紫江青年学者) at
    <a href="https://www.ecnu.edu.cn/">East China Normal University (ECNU)</a>.
    I obtained my Ph.D. degree in Electronic Engineering from Shanghai Jiao Tong University in September 2025,
    under the supervision of
    <a href="https://min.sjtu.edu.cn/En/FacultyShow/4?Vid=17">Chenglin Li</a>
    and <a href="https://min.sjtu.edu.cn/En/FacultyShow/4?Vid=14">Hongkai Xiong</a>
    at the <a href="https://min.sjtu.edu.cn/">MIN Laboratory</a>.
  </p>
  <p>
    My research interests include Federated Learning, Distributed Compression and Optimization, Bayesian Learning, and the Information Bottleneck.
  </p>

